name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from the main branch root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api repos/${{ github.repository }}/pages
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Pages already enabled"
            gh api --method PUT repos/${{ github.repository }}/pages \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -f "source[branch]=main" \
              -f "source[path]=/" \
              -f cname=fit.cashandcarries.com || true
          else
            echo "Creating Pages site from main /"
            gh api --method POST repos/${{ github.repository }}/pages \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -f build_type=legacy \
              -f "source[branch]=main" \
              -f "source[path]=/" \
              -f cname=fit.cashandcarries.com
          fi
